<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>مراجعة كويز 1 كمي 107</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
:root,[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f6fa; --surface:#ffffff; --surface-2:#eef0f6; --ink:#171a33; --muted:#5e6280; --line:#e3e5ef;
  --accent:#5a3fd8; --accent-ink:#ffffff; --accent-soft:#ece8fd;
  --btn:#171a33; --btn-ink:#ffffff;
  --good:#138a55; --good-soft:#dcf4e7; --bad:#d23a3a; --bad-soft:#fde4e2; --warn:#b36200; --warn-soft:#ffecd4;
  --t1:#e8e3ff; --t2:#d9f3e6; --t3:#ffe7d1; --t4:#ffe0e4;
  --c1:#5a3fd8; --c2:#b4a6f2; --c3:#38b27a; --c4:#f09a3e; --grid:#eceef4;
  --sans:"Rubik",system-ui,sans-serif; --ar:"Rubik",system-ui,sans-serif; --mono:"Rubik",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1124; --surface:#181b34; --surface-2:#232746; --ink:#f1f1fa; --muted:#a5a8c6; --line:#2a2e50;
  --accent:#a795ff; --accent-ink:#140f33; --accent-soft:#2a2656;
  --btn:#f1f1fa; --btn-ink:#171a33;
  --good:#5fd99a; --good-soft:#123126; --bad:#ff8585; --bad-soft:#3b1a22; --warn:#ffb35c; --warn-soft:#3a2914;
  --t1:#2a2656; --t2:#15332a; --t3:#3a2a1c; --t4:#3a1d2a;
  --c1:#a795ff; --c2:#4a3f8f; --c3:#4fc48d; --c4:#f0a552; --grid:#262a48;
}}
:root[data-theme="dark"],[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1124; --surface:#181b34; --surface-2:#232746; --ink:#f1f1fa; --muted:#a5a8c6; --line:#2a2e50;
  --accent:#a795ff; --accent-ink:#140f33; --accent-soft:#2a2656;
  --btn:#f1f1fa; --btn-ink:#171a33;
  --good:#5fd99a; --good-soft:#123126; --bad:#ff8585; --bad-soft:#3b1a22; --warn:#ffb35c; --warn-soft:#3a2914;
  --t1:#2a2656; --t2:#15332a; --t3:#3a2a1c; --t4:#3a1d2a;
  --c1:#a795ff; --c2:#4a3f8f; --c3:#4fc48d; --c4:#f0a552; --grid:#262a48;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)} a:hover{color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding-inline:18px;padding-block:28px 88px}

header.top{text-align:center;padding:12px 0 4px}
header.top h1{font-size:30px;line-height:1.3;font-weight:700;margin:0 0 10px;text-wrap:balance}
header.top p{margin:0 auto;color:var(--muted);max-width:52ch;text-wrap:pretty}
.toprow{display:flex;flex-direction:column-reverse;align-items:center;gap:14px}
.themebtn{border:none;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:8px 18px;font:inherit;font-size:13.5px;font-weight:500;min-height:38px;cursor:pointer;white-space:nowrap}
.themebtn:hover{background:var(--accent-soft)}
.themebtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

button{font:inherit;cursor:pointer;color:inherit}
.primary{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;min-height:50px;background:var(--btn);color:var(--btn-ink);border:none;border-radius:999px;padding:12px 26px;font-size:16px;font-weight:600;transition:transform .12s,opacity .15s}
.primary:hover:not(:disabled){transform:translateY(-1px)}
.primary:active:not(:disabled){transform:scale(.98)}
.primary:disabled{opacity:.35;cursor:default}
.primary:focus-visible,.ghost:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ghost{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:none;background:none;color:var(--ink);font-weight:500;padding:10px 16px;border-radius:999px;transition:background .15s}
.ghost:hover{background:var(--surface-2)}
.ghost.bordered{border:2px solid var(--btn);background:transparent;padding:10px 24px;min-height:50px;font-weight:600}
.ghost.bordered:hover{background:var(--surface)}
#reset{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
#reset:hover{color:var(--bad);background:none}
.chip{border:none;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:7px 16px;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.chip:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px;margin-top:12px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.score{font-weight:600;font-size:15px;flex:1 1 auto;min-width:0;line-height:1.35}
.score .num{font-variant-numeric:tabular-nums}
.qbar{direction:ltr;font-family:var(--sans);margin-top:8px}
.qbar .row{flex-wrap:nowrap}
.qbar .spacer{display:none}
.timer{white-space:nowrap;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;border-radius:999px;padding:6px 16px;background:var(--accent-soft);color:var(--accent)}
.timer.low{color:var(--bad);background:var(--bad-soft)}
.progress{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;border-radius:99px;transition:width .4s cubic-bezier(.3,.7,.3,1)}

.panel{margin-top:22px;background:transparent;border:none;padding:0;direction:ltr;text-align:left;font-family:var(--sans)}
.panel>h2{margin:0 0 6px;font-size:26px;font-weight:700;line-height:1.25}
.panel>.sub{color:var(--muted);margin:0 0 22px;font-size:15px;text-wrap:pretty}

.banks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.bank{display:flex;flex-direction:column;border-radius:28px;padding:24px;background:var(--t1)}
.bank:nth-child(2){background:var(--t2)}
.bank:nth-child(3){background:var(--t3)}
.bank:nth-child(4){background:var(--t4)}
.bank h2{font-size:22px;font-weight:700;margin:0 0 4px;line-height:1.3}
.bank .sub{margin:0 0 22px;font-size:14px;color:var(--muted);flex:1}
.bank .actions{margin-top:auto}
.bank .actions>*{flex:1 1 auto}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--btn);color:var(--btn-ink);border-radius:24px;padding:14px 14px 14px 22px;margin-bottom:16px;font-weight:500;font-size:15px}
.resume .primary{background:var(--accent);color:var(--accent-ink);min-height:44px}

.hist{list-style:none;padding:8px 20px;margin:22px 0 0;display:grid;background:var(--surface);border-radius:24px}
.hist li{display:flex;gap:14px;align-items:baseline;font-size:15px;padding:12px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:none}
.hist .n{flex:1;font-weight:500}
.hist li span:nth-child(2){font-weight:700;font-variant-numeric:tabular-nums}

.sec{margin:32px 0 10px;direction:ltr;text-align:left;font-family:var(--sans)}
.sec small{display:block;color:var(--accent);font-weight:600;font-size:13px}
.sec h2{margin:2px 0 0;font-size:20px}

.card{background:var(--surface);border:none;border-radius:28px;padding:26px;margin-bottom:16px;direction:ltr;text-align:left;font-family:var(--sans)}
.meta{line-height:1.4;display:flex;gap:6px 10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin-bottom:12px;align-items:center}
.meta b{color:var(--ink);font-weight:600}
.lvl{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 12px;background:var(--surface-2);color:var(--muted)}
.lvl.Easy{background:var(--good-soft);color:var(--good)}
.lvl.Medium{background:var(--warn-soft);color:var(--warn)}
.lvl.Hard{background:var(--bad-soft);color:var(--bad)}
.topic{font-weight:500}
.q{margin:0 0 20px;font-size:20px;font-weight:600;line-height:1.5;text-wrap:pretty}
.fig{margin:0 0 22px;overflow-x:auto;overflow-y:hidden;background:var(--bg);border-radius:20px;padding:18px}
.fig svg{display:block;max-width:100%;height:auto;margin-inline:auto}
table.t{border-collapse:separate;border-spacing:0 4px;font-size:15px;font-variant-numeric:tabular-nums;margin-inline:auto;min-width:240px}
table.t th,table.t td{padding:8px 18px;text-align:left}
table.t td{background:var(--surface)}
table.t td:first-child{border-radius:12px 0 0 12px}
table.t td:last-child{border-radius:0 12px 12px 0;text-align:right;font-weight:600}
table.t th{font-weight:600;font-size:13px;color:var(--muted)}
table.t th:last-child{text-align:right}
table.t tr.tot td{font-weight:700;background:var(--accent-soft)}
.qimg{display:block;width:100%;max-width:760px;height:auto;border-radius:18px;margin:4px 0 20px;background:#fff}

.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.opts.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.opts.letters{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.opts.letters .opt{justify-content:center;padding:10px}
.opt{display:flex;gap:14px;align-items:center;width:100%;min-height:62px;text-align:left;border:2px solid transparent;background:var(--surface-2);color:var(--ink);border-radius:20px;padding:12px 16px;transition:background .15s,border-color .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .L{flex:none;width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink)}
.opt .body{flex:1;min-width:0;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.opt .body svg{max-width:100%;height:auto;display:block}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.opt.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.sel .L{background:var(--accent-ink);color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .L{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .L{background:var(--bad);color:var(--surface)}
.hint{color:var(--muted);font-size:13.5px;margin:10px 0 0}

.nav{display:flex;justify-content:space-between;align-items:center;direction:ltr;margin-top:6px;gap:10px}
.nav .primary{flex:1;max-width:320px}
.confirm{direction:ltr;font-family:var(--sans);margin-top:16px;background:var(--surface);border-radius:28px;padding:24px;text-align:center;border:2px solid var(--accent)}
.confirm p{margin:0 0 18px;color:var(--muted);text-wrap:pretty}
.confirm p strong{display:block;color:var(--ink);font-size:21px;font-weight:700;margin-bottom:4px}
.confirm .actions{justify-content:center}

.rvbar{display:flex;justify-content:space-between;align-items:center;direction:ltr;font-family:var(--sans);margin:16px 0 12px}
.status{font-weight:700;font-size:14px;padding:6px 16px;border-radius:999px}
.status.ok{color:var(--good);background:var(--good-soft)} .status.no{color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:16px;padding:16px 18px;border-radius:20px;font-size:15px;line-height:1.65}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb strong{display:block;margin-bottom:4px;font-size:16px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:0 0 22px}
.stats div{display:flex;flex-direction:column;gap:2px;background:var(--t2);border-radius:24px;padding:18px 22px}
.stats div:nth-child(2){background:var(--t4)}
.stats b{font-size:36px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums}
.stats span{font-size:14px;color:var(--muted)}
.review{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:8px}
.review li{border-radius:20px;padding:14px 18px;font-size:15.5px;font-weight:500;background:var(--surface);cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.review li:hover{border-color:var(--accent)}
.review li button{all:unset;display:block;width:100%;cursor:pointer}
.review li:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.review .tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;margin-inline-end:8px}
.review .ok{color:var(--good);background:var(--good-soft)} .review .no{color:var(--bad);background:var(--bad-soft)}
.review small{display:block;color:var(--muted);margin-top:3px;font-size:13px;font-weight:400}
.end{margin-top:28px;background:var(--surface);border-radius:28px;padding:28px;text-align:center}
.end .big{font-size:44px;font-weight:700}
.maker{margin:14px auto 0!important;font-size:14.5px;color:var(--muted)}
.maker a{display:inline-flex;align-items:center;gap:6px;margin-inline-start:4px;background:var(--accent-soft);color:var(--accent);font-weight:700;text-decoration:none;border-radius:999px;padding:4px 14px}
.maker a:hover{color:var(--accent);filter:brightness(.97)}
.maker a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mbtn{margin-top:12px;align-self:flex-start;border:none;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:500;padding:6px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;direction:ltr}
.mbtn b{display:inline-block;min-width:24px;text-align:center;margin-inline-start:6px;background:var(--surface);border-radius:999px;padding:0 8px;text-decoration:none}
.mbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.banks{grid-template-columns:minmax(0,370px);justify-content:center}
#home>.hist,#home>.actions,#home>.resume{max-width:370px;margin-inline:auto}
/* compact question screen: fit without page scrolling */
header.top.inquiz h1,header.top.inquiz>p:not(.maker){display:none}
header.top.inquiz{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 12px;padding:0}
header.top.inquiz .toprow{display:contents}
header.top.inquiz .themebtn{min-height:32px;padding:4px 14px}
header.top.inquiz .maker{margin:0!important}
body.inquiz .wrap{padding-block:8px 10px}
body.inquiz .qbar{padding-block:6px;margin-top:2px;gap:8px}
body.inquiz .progress{height:8px}
body.inquiz .timer{font-size:15px;padding:3px 12px}
body.inquiz #exitq{min-height:36px;padding:6px 10px}
body.inquiz .card{padding:14px 18px;margin-bottom:8px;border-radius:22px}
body.inquiz .meta{margin-bottom:6px}
body.inquiz .q{font-size:17px;line-height:1.45;margin-bottom:10px}
body.inquiz .fig{padding:8px;margin-bottom:10px;max-height:36vh;overflow:auto;display:flex;justify-content:center;align-items:flex-start;border-radius:16px}
body.inquiz .fig svg{max-height:calc(36vh - 16px);width:auto;max-width:100%}
body.inquiz table.t{font-size:13.5px;border-spacing:0 2px}
body.inquiz table.t th,body.inquiz table.t td{padding:4px 14px}
body.inquiz .opts{gap:8px}
body.inquiz .opt{min-height:44px;padding:7px 12px;border-radius:16px;gap:10px}
body.inquiz .opt .L{width:28px;height:28px;font-size:13px}
body.inquiz .opt .body{font-size:15.5px}
body.inquiz .opt .body svg{max-height:24vh;width:auto;margin-inline:auto}
body.inquiz .opt .body table.t{font-size:12.5px}
body.inquiz .nav{margin-top:2px}
body.inquiz .nav .ghost,body.inquiz .nav .primary{min-height:44px;padding-block:8px}
body.inquiz .confirm{padding:14px;margin-top:8px}
body.inquiz .confirm p{margin-bottom:10px}
@media (max-width:520px){body.inquiz .q{font-size:16px}body.inquiz .card{padding:12px 14px}body.inquiz .opts{grid-template-columns:1fr 1fr}body.inquiz .opt{padding:6px 10px}}
.credit{margin-top:40px;color:var(--muted);font-size:13px;text-align:center}
svg text{font-family:var(--sans);fill:var(--ink)}
svg .mut{fill:var(--muted)}

@media (max-width:520px){
  .wrap{padding-inline:14px;padding-block:20px 72px}
  header.top h1{font-size:25px}
  .card{padding:20px;border-radius:24px}
  .bank{padding:20px;border-radius:24px}
  .q{font-size:18px}
  .fig{padding:12px}
  .opts{grid-template-columns:1fr}
  .nav .primary{max-width:none}
  .actions>.primary,.actions>.ghost.bordered{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){.progress i,.opt,.primary{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="toprow"><h1>مراجعة الكويز الأول: مبادئ الإحصاء في الإدارة</h1><button class="themebtn" id="themebtn" aria-label="تبديل الوضع">الوضع النهاري</button></div>
    <p>٥٤ سؤال من مراجعة الكويز الأول. كل اختبار ٦ أسئلة ومدته ٢٠ دقيقة، والإجابات تظهر بعد التسليم، والأسئلة اللي تخطئ فيها تنحفظ في أخطائي.</p>
    <p class="maker">صنع بكل حب وود من خلال: <a href="https://t.me/ii8lkk" target="_blank" rel="noopener"><bdi dir="ltr">Knight</bdi><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M21.4 4.3 18.3 19c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.3-4.7 8.6-7.8c.4-.3-.1-.5-.6-.2L6.5 13 2 11.6c-1-.3-1-1 .2-1.5L20 3.2c.8-.3 1.6.2 1.4 1.1z"/></svg></a></p>
  </header>

  <section id="home" class="panel"></section>

  <section id="quiz" hidden>
    <div class="bar qbar">
      <div class="row">
        <span class="score" id="qpos">Question 1 of 6</span>
        <span class="spacer"></span>
        <span class="timer" id="timer">20:00</span>
        <button class="ghost" id="exitq">Save &amp; exit</button>
      </div>
      <div class="progress"><i id="pg"></i></div>
    </div>
    <article class="card" id="qcard"></article>
    <div class="nav"><button class="ghost" id="back">Back</button><button class="primary" id="next" disabled>Next</button></div>
    <div class="confirm" id="confirm" hidden>
      <p><strong>Submit this quiz?</strong> <span id="confirmtxt"></span></p>
      <div class="actions"><button class="primary" id="dosubmit">Yes, submit</button><button class="ghost" id="nosubmit">Keep reviewing</button></div>
    </div>
  </section>

  <section id="result" class="panel" hidden></section>
  <section id="mist" class="panel" hidden></section>
  <section id="review" hidden></section>
</div>

<script>
/* ---------- chart helpers ---------- */
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function axes(o,draw){
  const W=o.w||520,H=o.h||290,L=o.l||52,R=o.r||16,T=o.t||(o.title?32:14),B=o.b||(o.xlabel?48:30);
  const sx=v=>L+(v-o.xmin)/(o.xmax-o.xmin)*(W-L-R);
  const sy=v=>H-B-(v-o.ymin)/(o.ymax-o.ymin)*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img">`;
  if(o.title)s+=`<text x="${W/2}" y="18" text-anchor="middle" font-size="14" font-weight="600">${esc(o.title)}</text>`;
  (o.yticks||[]).forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)" fill="none"/><text class="mut" x="${L-6}" y="${sy(v)+4}" text-anchor="end" font-size="11">${v}</text>`});
  (o.xticks||[]).forEach(t=>{const v=t.v??t,lab=t.l??t;s+=`<text class="mut" x="${sx(v)}" y="${H-B+16}" text-anchor="middle" font-size="11">${esc(lab)}</text>`});
  s+=`<line x1="${L}" x2="${W-R}" y1="${sy(o.ymin)}" y2="${sy(o.ymin)}" stroke="var(--muted)" fill="none"/>`;
  if(!o.noY)s+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${sy(o.ymin)}" stroke="var(--muted)" fill="none"/>`;
  if(o.xlabel)s+=`<text class="mut" x="${(L+W-R)/2}" y="${H-8}" text-anchor="middle" font-size="12">${esc(o.xlabel)}</text>`;
  if(o.ylabel)s+=`<text class="mut" transform="translate(13 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="12">${esc(o.ylabel)}</text>`;
  return s+draw(sx,sy)+"</svg>";
}
function bars(labels,vals,o){
  const n=labels.length;
  return axes({...o,xmin:0,xmax:n,xticks:labels.map((l,i)=>({v:i+.5,l}))},(sx,sy)=>vals.map((v,i)=>`<rect x="${sx(i+.15)}" y="${sy(v)}" width="${sx(.85)-sx(.15)}" height="${sy(0)-sy(v)}" fill="var(--c1)" stroke="var(--surface)"/>`).join(""));
}
function hist(edges,f,o){
  return axes({...o,xmin:edges[0],xmax:edges[edges.length-1],xticks:edges},(sx,sy)=>f.map((v,i)=>`<rect x="${sx(edges[i])}" y="${sy(v)}" width="${sx(edges[i+1])-sx(edges[i])}" height="${Math.max(0,sy(0)-sy(v))}" fill="var(--c1)" stroke="var(--surface)" stroke-width="1.5"/>`).join(""));
}
function lines(series,o){
  return axes(o,(sx,sy)=>series.map(se=>{
    const pts=se.p.map(([x,y])=>`${sx(x)},${sy(y)}`).join(" ");
    let s=`<polyline points="${pts}" fill="none" stroke="${se.c||'var(--c1)'}" stroke-width="2"/>`;
    se.p.forEach(([x,y])=>{s+=`<circle cx="${sx(x)}" cy="${sy(y)}" r="3.5" fill="${se.c||'var(--c1)'}"/>`;if(o.lab)s+=`<text x="${sx(x)}" y="${sy(y)-8}" text-anchor="middle" font-size="11" font-weight="600">${y}</text>`});
    return s;
  }).join("")+(o.legend?o.legend.map((l,i)=>`<circle cx="${(o.w||520)-120}" cy="${22+i*18}" r="4" fill="${series[i].c}"/><text x="${(o.w||520)-110}" y="${26+i*18}" font-size="12">${l}</text>`).join(""):""));
}
function dots(min,max,counts,title){
  const W=520,H=200,L=24,R=24,base=150,step=13;
  const sx=v=>L+(v-min)/(max-min)*(W-L-R);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img"><text x="${W/2}" y="18" text-anchor="middle" font-size="14" font-weight="600">${esc(title)}</text><line x1="${L-10}" x2="${W-R+10}" y1="${base}" y2="${base}" stroke="var(--ink)" stroke-width="1.5" fill="none"/>`;
  for(let v=min;v<=max;v++)s+=`<text class="mut" x="${sx(v)}" y="${base+26}" text-anchor="middle" font-size="11">${v}</text>`;
  Object.entries(counts).forEach(([v,c])=>{for(let k=0;k<c;k++)s+=`<circle cx="${sx(+v)}" cy="${base-10-k*step}" r="5" fill="var(--c1)"/>`});
  return s+"</svg>";
}
function pie(items,o={}){
  const S=o.s||300,cx=S/2,cy=S/2+(o.title?10:0),r=S*.3;
  const cols=["var(--c2)","var(--c1)","var(--c3)","var(--c4)"];
  let a=Math.PI/2,s=`<svg viewBox="0 0 ${S} ${S+(o.title?20:0)}" width="${S}" role="img">`;
  if(o.title)s+=`<text x="${cx}" y="18" text-anchor="middle" font-size="14" font-weight="600">${esc(o.title)}</text>`;
  items.forEach((it,i)=>{
    const sw=it[1]/100*2*Math.PI,a2=a+sw,mid=a+sw/2;
    const p=(ang,rr)=>[cx+rr*Math.cos(ang),cy-rr*Math.sin(ang)];
    const [x1,y1]=p(a,r),[x2,y2]=p(a2,r);
    s+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${sw>Math.PI?1:0} 0 ${x2},${y2} Z" fill="${cols[i%4]}" stroke="var(--surface)" stroke-width="1.5"/>`;
    const [lx,ly]=p(mid,r*.6),[ox,oy]=p(mid,r*1.2);
    s+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="12" font-weight="600" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">${it[1].toFixed(1)}%</text>`;
    s+=`<text x="${ox}" y="${oy+4}" text-anchor="${Math.cos(mid)>.2?'start':Math.cos(mid)<-.2?'end':'middle'}" font-size="12">${esc(it[0])}</text>`;
    a=a2;
  });
  return s+"</svg>";
}
function table(h,rows,tot){
  return `<table class="t"><tr>${h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr>${rows.map((r,i)=>`<tr${tot&&i===rows.length-1?' class="tot"':''}>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
}
const fdTable=(rows,total)=>table(["Class","Frequency"],[...rows,["Total",total]],true);

const Q=[
{s:S1,t:S1t,lv:"Easy",tp:"Professional Use of Statistics in Business",q:"The management of Saudi Arabian Airlines (Saudia) wants to improve on-time performance. How can statistics help them?",o:["By analyzing flight data to identify the most common causes of delays.","By asking pilots to guess why the planes are late.","By creating a new logo for the airline.","By counting the total number of flights per year.","By surveying customers who have never flown with Saudia."],a:0,ex:"Statistics turns data into evidence: finding the main causes of delays is what lets management act on them."},
{s:S1,t:S1t,lv:"Easy",tp:"The Core Definition of Statistics",q:"What is the ultimate goal of using the statistical process in a business context?",o:["To make better and more effective decisions.","To prove personal opinions with numbers.","To create complicated mathematical formulas.","To collect as much data as possible without a purpose.","To generate reports with many charts."],a:0,ex:"The whole process (collect, organize, analyze, interpret) exists to support better decisions."},
{s:S1,t:S1t,lv:"Easy",tp:"The General Importance of Statistics",q:"Examples of data generation include using apps like \"Tawakkalna\" or shopping at \"Panda.\" What is the main point of these examples?",o:["Data is being generated constantly all around us in our modern world.","You should not use government apps or shop at big stores.","Data is only generated when you spend money.","Only a few activities in life generate data.","All data that is generated is easy to understand."],a:0,ex:"Everyday activities constantly produce data."},
{s:S1,t:S1t,lv:"Easy",tp:"Use of Statistics in Personal Life",q:"You read a news report that claims a new health product is effective. What does a knowledge of statistics allow you to do?",o:["Question the study by asking about the sample size and its significance.","Immediately believe the report without any questions.","Assume the report is false because most news is fake.","Buy the health product immediately before it sells out.","Share the news report with all of your friends on social media."],a:0,ex:"Statistical literacy lets you judge a claim by how the evidence was gathered."},
{s:S2,t:S2t,lv:"Easy",tp:"Identifying Descriptive Statistics",q:"An analyst calculates the interquartile range (IQR) of the salaries for the 100 employees in his department to describe the spread of the middle 50%. This is:",o:["Descriptive Statistics","Inferential Statistics","A prediction of future salary ranges","A sample of salaries from the entire company","A hypothesis about income inequality"],a:0,ex:"He summarizes the data he has, with no conclusion beyond it: descriptive."},
{s:S2,t:S2t,lv:"Easy",tp:"Identifying Inferential Statistics",q:"A telecom company analyzes the past behavior of its customers to predict which customers are likely to cancel their service in the next month. This prediction uses:",o:["Inferential Statistics","Descriptive Statistics","Listing the past behavior of all customers","A guarantee that the predicted customers will cancel","A customer contact list"],a:0,ex:"Predicting beyond the observed data is inference."},
{s:S2,t:S2t,lv:"Medium",tp:"Identifying the Parameter",q:"STC's research goal is to find the percentage of all its current mobile plan customers who are satisfied. The company surveys 2,000 customers to estimate this percentage. The parameter STC is interested in is:",o:["The percentage of all current mobile plan customers who are satisfied.","The percentage of the 2,000 surveyed customers who are satisfied.","All of STC's current mobile plan customers.","The 2,000 customers who were surveyed.","The number of satisfied customers."],a:0,ex:"A parameter is a number describing the whole population. The 2,000-customer percentage would be the statistic."},
{s:S2,t:S2t,lv:"Easy",tp:"Identifying the Population",q:"STC's research goal is to determine the satisfaction level of its current mobile plan customers. To investigate, the company sends a survey to 10,000 of its customers. Based on the research goal, what is the population STC is interested in?",o:["STC's current mobile plan customers.","The 10,000 customers who were sent the survey.","All mobile phone users in Saudi Arabia.","The true satisfaction level of STC mobile customers.","The customers who respond to the survey."],a:0,ex:"The population is the whole group of interest, set by the research goal."},
{s:S2,t:S2t,lv:"Easy",tp:"Identifying the Sample",q:"Danube supermarkets' objective is to know if their customers prefer paper or plastic bags. They ask 1,000 shoppers at various branches for their preference. The sample used by Danube is:",o:["The 1,000 shoppers who were asked.","Customers of Danube supermarkets.","The percentage of the 1,000 shoppers who prefer paper.","The true preference of all Danube customers.","All supermarket shoppers in the Kingdom."],a:0,ex:"The sample is the part of the population actually measured."},
{s:S2,t:S2t,lv:"Medium",tp:"Identifying the Statistic",q:"Danube asks 1,000 shoppers for their preference and finds that 65% prefer paper bags. This is used to estimate the preference of all Danube customers. The statistic from this survey is:",o:["The 65% of the 1,000 surveyed shoppers who prefer paper bags.","The proportion of all Danube customers who prefer paper bags.","The 1,000 shoppers who were asked.","All customers of Danube supermarkets.","The number of shoppers who prefer paper bags."],a:0,ex:"A statistic is a number computed from the sample."},
{s:S2,t:S2t,lv:"Easy",tp:"Level of Measurement: Ratio",q:"A logistics company in Jeddah measures the weight of a shipment in kilograms (kg). What is the level of measurement for the shipment's weight?",o:["Ratio","Interval","Ordinal","Nominal","Quantitative Continuous"],a:0,ex:"Weight has a true zero, so ratios make sense (10 kg is twice 5 kg). Quantitative continuous is a variable type, not a level."},
{s:S2,t:S2t,lv:"Medium",tp:"Levels of Measurement: Interval Scale",q:"The admissions office at King Saud University analyzes the Qiyas (General Aptitude Test) scores of its applicants. The scores have equal intervals between them. What is the level of measurement for Qiyas scores?",o:["Quantitative Discrete","Interval","Ratio","Nominal","Ordinal"],a:1,ex:"Equal intervals but no true zero: a score of 0 does not mean zero ability."},
{s:S2,t:S2t,lv:"Easy",tp:"Levels of Measurement: Nominal Scale",q:"A human resources department collects data on the city of birth for its employees (e.g., Riyadh, Jeddah, Dammam). What is the level of measurement for the city name?",o:["Nominal","Ordinal","Interval","Ratio","Qualitative"],a:0,ex:"Names with no natural order are nominal."},
{s:S2,t:S2t,lv:"Easy",tp:"Levels of Measurement: Ordinal Scale",q:"An airline's loyalty program has different tiers for its customers, such as \"Bronze\", \"Silver\", and \"Gold\". What is the level of measurement for these tiers?",o:["Ordinal","Nominal","Interval","Ratio","Qualitative"],a:0,ex:"The tiers have a clear order, but the gaps between them are not measurable."},
{s:S2,t:S2t,lv:"Easy",tp:"Variable Types: Qualitative",q:"A government form asks for a person's marital status (\"Single\", \"Married\", \"Divorced\"). What is the variable type for \"Marital Status\"?",o:["Qualitative","Nominal","Quantitative Discrete","Quantitative Continuous","Interval"],a:0,ex:"The question asks for the variable type, not the level. Categories are qualitative (nominal is its level of measurement)."},
{s:S2,t:S2t,lv:"Easy",tp:"Variable Types: Quantitative Continuous",q:"An engineer measures the voltage of a battery, which reads 1.48 volts. What type of variable is voltage?",o:["Quantitative Continuous","Ratio","Quantitative Discrete","Qualitative","Nominal"],a:0,ex:"Voltage is measured and can take any value in a range."},
{s:S2,t:S2t,lv:"Easy",tp:"Variable Types: Quantitative Discrete",q:"The manager of a Panda supermarket tracks the number of sales transactions each day. How would you classify the \"number of transactions\" variable?",o:["Quantitative Discrete","Ratio","Qualitative","Quantitative Continuous","Interval"],a:0,ex:"Transactions are counted in whole numbers."},
{s:S3,t:S3t,lv:"Medium",tp:"Identifying Ethical Practices",q:"A researcher conducts a survey of university students in Riyadh. In the conclusion, he states: \"These findings are based on students in the capital and may not represent the views of all young people across Saudi Arabia.\" How would you classify this statement?",o:["This is a responsible and ethical use of statistics.","This is an unethical use of statistics.","This is a weak statement that makes the research look bad.","This is an unnecessary detail for a business report.","This is an admission that the study was a failure."],a:0,ex:"Stating the limits of a study is ethical practice."},
{s:S3,t:S3t,lv:"Medium",tp:"Identifying Unethical Practices",q:"After surveying a small, non-random sample of 20 people, an analyst reports that \"Exactly 63.1578% of the population thinks…\" to make the finding sound more scientific and credible than it actually is. How would you classify this action?",o:["This is an unethical use of statistics.","This is a responsible and ethical use of statistics.","This shows the analyst is very accurate with their math.","This is a standard way to report percentages.","This is a mathematical fact, not an ethical issue."],a:0,ex:"False precision from a small, non-random sample misleads the reader."},
{s:S3,t:S3t,lv:"Medium",tp:"More Ethical Practices",q:"In the introduction to a major analytical report, the lead statistician makes sure to list the names of the junior analysts who were responsible for collecting and cleaning the data. How would you classify this action?",o:["This is a responsible and ethical action.","This is an unethical action.","This is unnecessary, the lead analyst should get all the credit.","This makes the lead analyst look weak.","This is a violation of the junior analysts' privacy."],a:0,ex:"Giving credit for others' work is ethical."},
{s:S3,t:S3t,lv:"Hard",tp:"More Unethical Practices",q:"To calculate the \"typical\" salary at a company, an analyst uses the mean. He knows the data is highly skewed by a few multi-million riyal executive salaries, and that the median would be a much more honest representation. How would you classify this action?",o:["This is an unethical use of statistics.","This is a responsible and ethical use of statistics.","This is acceptable because the mean is a valid type of average.","This is a mathematical error, not an ethical one.","This is the only way to calculate an average."],a:0,ex:"Knowingly choosing a misleading measure is unethical, even if the math is correct."},

{s:S4,t:S4t,lv:"Easy",tp:"Frequency From Pie",q:"The pie chart below shows the proportion of different 'Mobile Providers'. The total number of observations was 205. Approximately how many observations were in the category 'STC'?",fig:()=>pie([["Zain",24.4],["Mobily",31.7],["STC",43.9]],{title:"Mobile Providers"}),o:["50","205","115","90"],a:3,ex:"43.9% × 205 ≈ 90."},

 o:[{h:pie([["Alinma",11.9],["SNB",31.0],["Al Rajhi",57.1]],{s:240})},{h:pie([["Alinma",11.9],["SNB",57.1],["Al Rajhi",31.0]],{s:240})},{h:pie([["Alinma",31.0],["SNB",11.9],["Al Rajhi",57.1]],{s:240})},{h:pie([["Alinma",33.3],["SNB",33.3],["Al Rajhi",33.4]],{s:240})}],a:0,ex:"Al Rajhi 240/420 = 57.1%, SNB 130/420 = 31.0%, Alinma 50/420 = 11.9%."},
{s:S4,t:S4t,lv:"Easy",tp:"Frequency Tables: Construction and Properties",q:"A sample of data was collected on the topic of 'Beverage Orders'. The responses were: Pepsi, Water, Laban, Coca-Cola, Orange Juice. Review the frequency table below. What is the best assessment of this table?",fig:()=>table(["Category","Frequency"],[["Soft Drinks",2],["Water",1],["Laban",1],["Juices",1],["Pepsi",1],["Total",6]],true),o:["The table is correct.","The categories are not mutually exclusive (an item fits in more than one category).","The categories are not collectively exhaustive (an item from the data is missing).","The total frequency is calculated incorrectly."],a:1,ex:"Pepsi is counted under both 'Soft Drinks' and 'Pepsi', so the categories overlap."},
{s:S4,t:S4t,lv:"Easy",tp:"Interpret Pie Chart",q:"The pie chart below shows data for 'Hotel Star Ratings'. Based on the chart, which of the following statements is true?",fig:()=>pie([["5-Star",16.7],["4-Star",33.3],["3-Star",50.0]],{title:"Hotel Star Ratings"}),o:["The \"4-Star\" slice is the largest.","The \"3-Star\" slice represents half of the total.","The \"5-Star\" slice is larger than the \"4-Star\" slice.","The \"4-Star\" and \"5-Star\" slices combined are larger than \"3-Star\"."],a:1,ex:"3-Star is 50%. 4-Star plus 5-Star is also exactly 50%, not larger."},

{s:S4,t:S4t,lv:"Medium",tp:"Relative Frequency Complement",q:"The table shows results for 'Investment Portfolio Types'. What is the relative frequency for observations that are NOT 'Bonds' or 'Real Estate'?",fig:()=>table(["Category","Frequency"],[["Stocks",120],["Real Estate",90],["Bonds",60],["Cash",30],["Crypto",10]]),o:["48.4%","160.0%","38.7%","51.6%","19.4%"],a:3,ex:"Total = 310. Not Bonds or Real Estate = 120 + 30 + 10 = 160. 160 / 310 = 51.6%."},
{s:S4,t:S4t,lv:"Hard",tp:"Relative Frequency Missing Value",q:"The frequency for 'Engineering' is missing from the table for 'Student Majors in a Class'. However, you know that the relative frequency for 'Business' is 42.11%. What is the missing frequency for 'Engineering'?",fig:()=>table(["Category","Frequency"],[["Business",40],["Engineering","?"],["Medicine",15],["Arts",10],["Law",5]]),o:["42.0","95","40","25","70"],a:3,ex:"Total = 40 / 0.4211 = 95. Engineering = 95 − (40 + 15 + 10 + 5) = 25."},
{s:S4,t:S4t,lv:"Medium",tp:"Relative Frequency More Than One Class",q:"The table shows results for 'Streaming Service Subscriptions'. What is the relative frequency for the combined categories of 'Shahid' and 'Netflix'?",fig:()=>table(["Category","Frequency"],[["Netflix",180],["Shahid",90],["YouTube Premium",30],["Amazon Prime",15],["OSN+",5]]),o:["84.4%","15.6%","270.0%","28.1%","56.2%"],a:0,ex:"Total = 320. (180 + 90) / 320 = 84.4%."},

function qHTML(q,perm,chosen,reveal){

  h+=`<div class="opts${q.letters?' letters':q.grid?' grid':''}">`;

    const o=q.o[oi];
    const cls=reveal?(ansSet(q).includes(oi)?" right":oi===chosen?" wrong":""):(oi===chosen?" sel":"");

  });
  h+="</div>";

function pickNew(bank){
  const all=BANKS[bank].list.map((_,i)=>i);let seen=st.seen[bank]||[];
  let unseen=shuf(all.filter(i=>!seen.includes(i)));
  if(unseen.length<PER){
    const fresh=shuf(all.filter(i=>!unseen.includes(i)));
    st.seen[bank]=[];
    return [...unseen,...fresh.slice(0,PER-unseen.length)];
  }
  return unseen.slice(0,PER);
}
function start(bank,timed){
  let keys;
  if(isMist(bank)){keys=shuf(wrongKeys(bank.includes(":")?baseOf(bank):undefined)).slice(0,PER);if(!keys.length)return home()}
  else{const ids=pickNew(bank);st.seen[bank]=[...new Set([...(st.seen[bank]||[]),...ids])];keys=ids.map(i=>bank+":"+i)}
  st.active={bank,timed,keys,perm:keys.map(k=>permFor(getQ(k))),ans:{},idx:0,start:Date.now(),spent:0};
  save();runQuiz();
}
function runQuiz(){
  if(!st.active.start){st.active.start=Date.now();save()}
  show("quiz");renderQ();clearInterval(tick);
  $("timer").hidden=!st.active.timed;
  tick=setInterval(updTimer,1000);updTimer();
}
const elapsed=()=>(st.active.spent||0)+(st.active.start?Date.now()-st.active.start:0);
const remaining=()=>MINUTES*60000-elapsed();
const mmss=s=>String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function updTimer(){
  if(!st.active)return;
  const t=$("timer");
  if(!st.active.timed){t.hidden=false;t.textContent=mmss(Math.floor(elapsed()/1000));t.classList.remove("low");return}
  const r=remaining();
  if(r<=0){finish(true);return}
  const s=Math.ceil(r/1000);t.textContent=mmss(s);t.classList.toggle("low",s<=120);
}
function bankLabel(b){return isMist(b)?(b.includes(":")?"My mistakes · "+BANKS[baseOf(b)].name:"My mistakes"):BANKS[b].name}
function renderQ(){
  const a=st.active,i=a.idx,n=a.keys.length;
  $("qpos").textContent=`${bankLabel(a.bank)} · Question ${i+1} of ${n}`;
  $("pg").style.width=(Object.keys(a.ans).length/n*100)+"%";
  $("qcard").innerHTML=qHTML(getQ(a.keys[i]),a.perm[i],a.ans[i],false);
  const nx=$("next");nx.disabled=a.ans[i]===undefined;nx.textContent=i===n-1?"Submit":"Next";
  $("back").hidden=i===0;
  $("confirm").hidden=true;
}
$("qcard").addEventListener("click",e=>{
  const b=e.target.closest(".opt");if(!b||b.disabled||!st.active)return;
  st.active.ans[st.active.idx]=+b.dataset.o;save();renderQ();
});
$("next").onclick=()=>{
  const a=st.active;if(!a)return;
  if(a.idx<a.keys.length-1){a.idx++;save();renderQ();window.scrollTo({top:0})}
  else{
    const got=Object.keys(a.ans).length;
    $("confirmtxt").textContent=`You answered ${got} of ${a.keys.length}. You cannot change your answers after submitting.`;
    $("confirm").hidden=false;$("confirm").scrollIntoView({block:"nearest"});
  }
};
$("dosubmit").onclick=()=>finish(false);
$("nosubmit").onclick=()=>{$("confirm").hidden=true};
$("exitq").onclick=()=>{const a=st.active;if(!a)return;a.spent=elapsed();a.start=null;save();clearInterval(tick);home()};
$("back").onclick=()=>{const a=st.active;if(a&&a.idx>0){a.idx--;save();renderQ()}};

function finish(timeUp){
  clearInterval(tick);
  const a=st.active;if(!a)return;
  const rows=a.keys.map((k,i)=>({k,perm:a.perm[i],c:a.ans[i]}));
  let score=0;
  rows.forEach(r=>{const q=getQ(r.k);if(isRight(q,r.c)){score++;delete st.wrong[r.k]}else st.wrong[r.k]=r.c??null});
  const used=Math.round(Math.min(a.timed?MINUTES*60000:Infinity,elapsed())/1000);
  if(!isMist(a.bank))st.history.unshift({bank:a.bank,score,total:rows.length,sec:used,timed:a.timed});
  st.last={bank:a.bank,timed:a.timed,rows,score,used,timeUp};
  st.active=null;save();result();
}
function result(){
  const R=st.last;if(!R)return home();
  const n=R.rows.length,base=isMist(R.bank)?(R.bank.includes(":")?baseOf(R.bank):undefined):R.bank,nw=wrongKeys(base).length;
  let h=`<h2>${R.timeUp?"Time is up":"Submitted"} · ${esc(bankLabel(R.bank))}</h2><p class="sub">${R.used/60|0} min ${R.used%60} s · tap any question to see it in full</p>`;
  h+=`<div class="stats"><div><b>${R.score} / ${n}</b><span>correct</span></div><div><b>${nw}</b><span>in this section's mistakes</span></div></div>`;
  h+=`<ul class="review">${R.rows.map((r,i)=>{const q=getQ(r.k),ok=isRight(q,r.c);return`<li><button data-i="${i}"><span class="tag ${ok?"ok":"no"}">${ok?"✓":"✗"} Q${i+1}</span> ${esc(q.tp||"")}<small>${r.c===undefined?"Not answered":ok?"Correct":"Wrong"}</small></button></li>`}).join("")}</ul>`;
  h+=`<div class="actions">${!isMist(R.bank)?`<button class="primary" id="again">Next quiz</button>`:""}${nw?`<button class="${isMist(R.bank)?"primary":"ghost"}" id="pm">Practice my mistakes</button>`:""}<button class="ghost" id="home2">Home</button></div>`;
  $("result").innerHTML=h;show("result");
  $("result").querySelectorAll(".review button").forEach(b=>b.onclick=()=>{const r=R.rows[+b.dataset.i];review(r.k,r.perm,r.c,result)});
  const ag=$("again");if(ag)ag.onclick=()=>start(R.bank,R.timed);
  $("home2").onclick=home;
  const pm=$("pm");if(pm)pm.onclick=()=>start(base?"mistakes:"+base:"mistakes",true);
}

function review(k,perm,chosen,back){
  const q=getQ(k),ok=isRight(q,chosen);
  const status=chosen===undefined||chosen===null?"Not answered":ok?"Correct":"Wrong";
  $("review").innerHTML=`<div class="rvbar"><button class="ghost" id="rvback">← Back</button><span class="status ${ok?"ok":"no"}">${status}</span></div><article class="card">${qHTML(q,perm||[...Array(q.o.length).keys()],chosen??undefined,true)}</article>`;
  show("review");$("rvback").onclick=back;
}

function mistakes(base){
  const ks=wrongKeys(base);
  let h=`<h2>My mistakes · ${esc(BANKS[base].name)}</h2><p class="sub">${ks.length?"Every question you got wrong is kept here. Answer it correctly in a practice round and it leaves the list.":"No mistakes saved in this section yet."}</p>`;
  if(ks.length)h+=`<ul class="review">${ks.map(k=>{const q=getQ(k);return`<li><button data-k="${k}"><span class="tag no">✗</span> ${esc(q.tp||"")}<small>${esc(BANKS[k.split(":")[0]].name)}</small></button></li>`}).join("")}</ul>`;
  h+=`<div class="actions">${ks.length?`<button class="primary" id="pm2">Practice my mistakes</button>`:""}<button class="ghost" id="home3">Home</button></div>`;
  $("mist").innerHTML=h;show("mist");
  $("mist").querySelectorAll(".review button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;review(k,null,st.wrong[k],()=>mistakes(base))});
  const p=$("pm2");if(p)p.onclick=()=>{if(st.active&&!p.dataset.confirm){p.dataset.confirm=1;p.textContent="Tap again: discard the unfinished quiz";return}start("mistakes:"+base,true)};
  $("home3").onclick=home;
}

function home(){
  clearInterval(tick);
  let h="";
  if(st.active)h+=`<div class="resume"><span>Unfinished quiz · ${esc(bankLabel(st.active.bank))} · ${Object.keys(st.active.ans).length} of ${st.active.keys.length} answered${st.active.timed?" · "+mmss(Math.max(0,Math.ceil(remaining()/1000)))+" left":""}</span><button class="primary" id="resume">Resume</button></div>`;
  h+=`<div class="banks">`;
  for(const [key,B] of Object.entries(BANKS)){
    const left=B.list.length-(st.seen[key]||[]).length,done=st.history.filter(x=>x.bank===key).length;
    h+=`<section class="bank"><h2>${esc(B.name)}</h2><p class="sub">${B.list.length} questions · ${left} not seen yet · ${done} quizzes taken</p><div class="actions">`;
    h+=B.timed.includes(true)?`<button class="primary" data-b="${key}" data-t="1">Start · ${MINUTES} min</button>`:"";
    h+=B.timed.includes(false)?`<button class="ghost bordered" data-b="${key}" data-t="0">Start · no timer</button>`:"";
    const nw=wrongKeys(key).length;
    h+=`</div><button class="mbtn" data-m="${key}">My mistakes <b>${nw}</b></button></section>`;
  }
  h+=`</div>`;
  if(st.history.length)h+=`<ul class="hist">${st.history.slice(0,6).map(x=>`<li><span class="n">${esc(BANKS[x.bank].name)}</span><span>${x.score} / ${x.total}</span><span style="color:var(--muted)">${x.sec/60|0} min${x.timed?"":" · no timer"}</span></li>`).join("")}</ul>`;
  h+=`<div class="actions" style="margin-top:14px"><button class="ghost" id="reset">Reset progress</button></div>`;
  $("home").innerHTML=h;show("home");
  $("home").querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{
    if(st.active&&!b.dataset.confirm){b.dataset.confirm=1;b.textContent="Tap again: discard the unfinished quiz";return}
    start(b.dataset.b,b.dataset.t==="1");
  });
  const r=$("resume");if(r)r.onclick=()=>(!st.active.timed||remaining()>0)?runQuiz():finish(true);
  $("home").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>mistakes(b.dataset.m));
  const x=$("reset");x.onclick=()=>{
    if(x.dataset.confirm){st={seen:{quiz:[]},history:[],active:null,wrong:{},last:null};save();home()}
    else{x.dataset.confirm=1;x.textContent="Tap again to erase everything"}
  };
}
/* ---------- theme ---------- */
const TKEY="stat107-theme",root=document.documentElement;
const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
function paintThemeBtn(){$("themebtn").textContent=isDark()?"الوضع النهاري":"الوضع الليلي"}
try{const t=localStorage.getItem(TKEY);if(t)root.dataset.theme=t}catch(e){}
paintThemeBtn();
$("themebtn").onclick=()=>{const t=isDark()?"light":"dark";root.dataset.theme=t;try{localStorage.setItem(TKEY,t)}catch(e){}paintThemeBtn()};
home();
</script>
